# Git hooks shared by the whole team — install with `npm install` at the root (or `make init`)
# Rules: CONTRIBUTING.md §0. Do not use --no-verify to dodge the hooks.
pre-commit:
  parallel: true
  commands:
    # H-3, H-7: no commits on main/dev, no committing secret files
    branch-guard:
      run: bash scripts/git-guard.sh pre-commit
    frontend-format:
      root: "frontend/"
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    backend-format:
      root: "backend/"
      glob: "**/*.java"
      run: ./mvnw -q spotless:apply
      stage_fixed: true

pre-push:
  commands:
    # H-4: no direct push / deleting main, dev
    branch-guard:
      run: bash scripts/git-guard.sh pre-push
      use_stdin: true

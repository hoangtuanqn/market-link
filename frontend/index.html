<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/marketlink-mark.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MarketLink — pre-order from your local farmers market, pick up at the stall." />
    <meta name="theme-color" content="#2f4a2a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Design system fonts: Patrick Hand (handwriting) + Chivo (print). Google serves the Vietnamese subset automatically. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <title>MarketLink</title>
    <!-- Theme trước khi vẽ trang (không nháy sáng ở chế độ tối). Cùng khoá và luật với src/lib/settings.ts. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('ml-settings') || '{}');
        var dark = s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (s.language) document.documentElement.lang = s.language;
      } catch (e) {}
    </script>
  </head>
  <body class="flex min-h-full flex-col">
    <div id="root" class="flex flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

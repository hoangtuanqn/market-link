# ---------------------------------------------------------------------
# docker compose up -d   -> CHỈ mysql + redis (chạy BE/FE trên máy, xem README)
# make up                -> full stack: + backend (Spring Boot) + frontend (Vite)
#                           = docker compose --profile app up -d --build
# make tools             -> thêm Adminer (DB UI) + RedisInsight
# make prod              -> build & chạy image production (docker-compose.prod.yml)
# ---------------------------------------------------------------------
services:
  mysql:
    image: mysql:8.4
    container_name: intervue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intervue_db}
      MYSQL_USER: ${MYSQL_USER:-intervue}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-intervue_pass}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Giữ time_zone của session MySQL là UTC cho khớp serverTimezone=UTC trong JDBC URL
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: intervue-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FR-111: broker STOMP cho chat realtime. Plugin rabbitmq_stomp không bật sẵn trong image
  # nên bật offline trước khi start. UI quản trị: http://localhost:${RABBITMQ_UI_PORT:-15672}
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: intervue-rabbitmq
    restart: unless-stopped
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-marketlink}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-marketlink_pass}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: dev
    image: market-link-backend:dev
    container_name: intervue-backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Hai nhánh song song dễ đẻ migration có số nhỏ hơn cái DB đã chạy (vd #130 sau #132).
      # Dev cho Flyway chạy bù thay vì chặn khởi động; prod giữ mặc định (false).
      SPRING_FLYWAY_OUT_OF_ORDER: ${SPRING_FLYWAY_OUT_OF_ORDER:-true}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-intervue_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intervue_db}
      MYSQL_USER: ${MYSQL_USER:-intervue}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-intervue_pass}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USER: ${RABBITMQ_USER:-marketlink}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-marketlink_pass}
      # FR-042 N3: Web Push; trống → tắt
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@marketlink.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      STORAGE_DIR: /app/uploads
      # FR-115: ảnh chat nằm tách khỏi /app/uploads (thư mục đó phục vụ công khai qua /uploads)
      CHAT_UPLOAD_DIR: ${CHAT_UPLOAD_DIR:-/var/lib/marketlink/chat}
      CHAT_MAX_UPLOAD_BYTES: ${CHAT_MAX_UPLOAD_BYTES:-5242880}
      CHAT_MESSAGES_PER_MINUTE: ${CHAT_MESSAGES_PER_MINUTE:-30}
      CHAT_IMAGES_PER_HOUR: ${CHAT_IMAGES_PER_HOUR:-10}
      CHAT_CONVERSATIONS_PER_HOUR: ${CHAT_CONVERSATIONS_PER_HOUR:-20}
      CHAT_TYPING_FRAMES_PER_MINUTE: ${CHAT_TYPING_FRAMES_PER_MINUTE:-120}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${BACKEND_DEBUG_PORT:-5005}:5005" # remote debug (IntelliJ / VS Code attach)
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - m2-cache:/root/.m2
      # Ảnh/video người dùng tải lên nằm ngay trong project (backend/uploads/) để mở ra xem được và
      # còn nguyên sau khi build lại container. .gitignore không commit chúng.
      - ./backend/uploads:/app/uploads
      - chat-uploads:/var/lib/marketlink/chat # FR-115: ảnh chat, kho riêng không phục vụ tĩnh
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: dev
    image: market-link-frontend:dev
    container_name: intervue-frontend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      # Bỏ trống → bản đồ dùng tile OpenStreetMap (xem .env.example)
      VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
      VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # giữ node_modules (có prettier/eslint plugin) của image, không bị host đè
    depends_on:
      - backend

  # ----- công cụ quản trị (chỉ chạy với --profile tools) -----
  adminer:
    image: adminer:latest
    container_name: intervue-adminer
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - mysql

  redisinsight:
    image: redis/redisinsight:latest
    container_name: intervue-redisinsight
    profiles: ["tools"]
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  m2-cache:
  chat-uploads:
  redisinsight-data:

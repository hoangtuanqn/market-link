<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password — MarketLink prototype</title>
<link rel="icon" href="../../../frontend/public/brand/marketlink-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../../../frontend/src/styles/marketlink-theme.css">
<link rel="stylesheet" href="../../../frontend/src/styles/marketlink-components.css">
<link rel="stylesheet" href="../prototype.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../data.js"></script>
<script src="../prototype.js"></script>
</head>
<body data-role="customer">
<div id="pt-top"></div>
<main class="pt-main pt-main-narrow">
  <p class="pt-small ml-muted"><a href="../customer/account.html">Account</a> · Change password</p>
  <div class="pt-col-2">
    <h1 class="pt-title">Change password</h1>
    <p class="pt-lead">You will be signed out on every device and asked to sign in again.</p>
  </div>
  <form class="ml-card pt-panel pt-col" novalidate>
    <div class="ml-field"><label class="ml-field-label" for="cur">Current password<span class="ml-field-req" aria-hidden="true">*</span></label><input id="cur" class="ml-input" type="password" autocomplete="current-password"></div>
    <div class="pt-form-grid">
      <div class="ml-field"><label class="ml-field-label" for="new">New password<span class="ml-field-req" aria-hidden="true">*</span></label><input id="new" class="ml-input" type="password" autocomplete="new-password"><span class="ml-field-hint">6 to 72 characters.</span></div>
      <div class="ml-field"><label class="ml-field-label" for="rep">Repeat new password<span class="ml-field-req" aria-hidden="true">*</span></label><input id="rep" class="ml-input" type="password" autocomplete="new-password"></div>
    </div>
    <div class="pt-row-2">
      <a class="ml-btn ml-btn-primary" href="../public/login.html" data-toast="Your password has been changed. Please sign in again.">Change password</a>
      <a class="ml-btn ml-btn-ghost" href="../customer/account.html">Cancel</a>
    </div>
  </form>
  <p class="pt-caption ml-muted"><span class="pt-todo" data-todo="Feature catalog · 'change password' is marked (proposal), not in the SRS. In the app this is /account/password (PR #125), opened from the Password &amp; security card on Account.">Change password is a proposal, not an SRS requirement</span></p>
</main>
<script>
  PT.boot({ role: 'customer', active: null });
</script>
<div id="pt-foot"></div>
</body>
</html>

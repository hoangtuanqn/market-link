<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products, filters and sort — MarketLink prototype</title>
<link rel="icon" href="../../../frontend/public/brand/marketlink-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../../../frontend/src/styles/marketlink-theme.css">
<link rel="stylesheet" href="../../../frontend/src/styles/marketlink-components.css">
<link rel="stylesheet" href="../prototype.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../data.js"></script>
<script src="../prototype.js"></script>
</head>
<body data-role="guest">
<div id="pt-top"></div>
<main class="pt-main">
  <div class="pt-col-2">
    <p class="ml-hand ml-muted">Saturday 26/09 · 4 markets · 9 stalls selling</p>
    <h1 class="pt-title">Products</h1>
    <p class="pt-lead">Everything the stalls have listed for this week. Filter by category, price, market and day, then add to your cart.</p>
  </div>

  <div class="pt-split-left">
    <aside class="pt-col" aria-label="Filters">
      <div class="ml-card pt-panel-4 pt-col">
        <div class="pt-between-c"><h2 class="pt-h3">Filters</h2><button type="button" class="ml-btn ml-btn-ghost ml-btn-sm">Clear all</button></div>
        <div id="day-chips"></div>
        <div class="pt-col-2">
          <span class="ml-field-label">Category</span>
          <div class="ml-chips" id="cat-chips"></div>
        </div>
        <div class="pt-col-2">
          <span class="ml-field-label">Price per unit</span>
          <div class="ml-chips" id="price-chips"></div>
        </div>
        <div class="ml-field" style="min-width:0">
          <label class="ml-field-label" for="market">Market</label>
          <select id="market" class="ml-input"><option>All markets</option><option>Thảo Điền Weekend Market</option><option>Thủ Đức Farmers Market</option><option>Phú Mỹ Hưng Saturday Market</option><option>Bà Chiểu Green Market</option></select>
        </div>
        <label class="ml-check"><input type="checkbox" checked><span class="ml-check-box" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="ml-check-text">In stock only<small>Hides sold-out and paused products</small></span></label>
      </div>
    </aside>

    <div class="pt-col">
      <div class="pt-between-c">
        <span class="pt-body"><b>18 products</b> match on Saturday 26/09</span>
        <div class="pt-row-2">
          <span class="pt-small ml-muted">Sort</span>
          <div class="ml-chips" id="sort-chips"></div>
        </div>
      </div>
      <div class="pt-grid-tags" id="products" data-state-target="loaded"></div>
      <div hidden data-state-target="loading" class="pt-grid-tags" id="skeleton"></div>
      <div hidden data-state-target="empty"></div>
      <div hidden data-state-target="error"></div>
      <div class="pt-between-c" id="pager"></div>
    </div>
  </div>

  <section class="pt-section">
    <h2 class="pt-h3">Other states of this list (FR-084)</h2>
    <div class="pt-row-2">
      <button type="button" class="ml-chip" aria-pressed="true" data-state-demo="loaded">With data</button>
      <button type="button" class="ml-chip" aria-pressed="false" data-state-demo="loading">Loading</button>
      <button type="button" class="ml-chip" aria-pressed="false" data-state-demo="empty">Empty</button>
      <button type="button" class="ml-chip" aria-pressed="false" data-state-demo="error">Error</button>
    </div>
  </section>
</main>
<script>
  document.getElementById('day-chips').innerHTML = PT.dayChips('Market day', PT.week.slice(0, 4).map(function (d) { return { value: d.value, label: d.label, sub: d.sub, disabled: d.value === 'thu' }; }), 'sat');
  document.getElementById('cat-chips').innerHTML = PT.categories.map(function (c, i) { return PT.chip(c.name, { count: c.count, selected: i === 0 }); }).join('');
  document.getElementById('price-chips').innerHTML = PT.chip('Under 30,000 ₫', { radio: 'price' }) + PT.chip('30,000 – 80,000 ₫', { radio: 'price' }) + PT.chip('Over 80,000 ₫', { radio: 'price' });
  document.getElementById('sort-chips').innerHTML = PT.chip('Newest', { selected: true, radio: 'sort' }) + PT.chip('Price, low to high', { radio: 'sort' }) + PT.chip('Price, high to low', { radio: 'sort' }) + PT.chip('Top rated', { radio: 'sort' });
  document.getElementById('products').innerHTML = PT.products.filter(function (p) { return p.status === 'available'; }).slice(0, 12).map(function (p) { return PT.productCard(p); }).join('');
  document.getElementById('skeleton').innerHTML = PT.skeletonCards(6);
  document.querySelector('[data-state-target="empty"]').innerHTML = PT.state('empty', 'Nothing under 30,000 ₫ in Dairy on Saturday', 'Củ Chi Goat Farm starts at 35,000 ₫ a jar. Remove the price filter or try Fruit.', '<button type="button" class="ml-btn ml-btn-secondary ml-btn-sm">Remove price filter</button>');
  document.querySelector('[data-state-target="error"]').innerHTML = PT.state('error', "Couldn't load products", 'Check your connection and try again.', '<button type="button" class="ml-btn ml-btn-danger ml-btn-sm">Try again</button>');
  document.getElementById('pager').innerHTML = '<span class="pt-small ml-muted">Showing 1–12 of 18</span>' + PT.pagination(1, 2);
  PT.boot({ active: 'products' });
</script>
<div id="pt-foot"></div>
</body>
</html>

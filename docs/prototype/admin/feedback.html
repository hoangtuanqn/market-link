<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback inbox — MarketLink prototype</title>
<link rel="icon" href="../../../frontend/public/brand/marketlink-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../../../frontend/src/styles/marketlink-theme.css">
<link rel="stylesheet" href="../../../frontend/src/styles/marketlink-components.css">
<link rel="stylesheet" href="../prototype.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../data.js"></script>
<script src="../prototype.js"></script>
</head>
<body data-role="admin" class="pt-quiet">
<div id="pt-top"></div>
<main class="pt-main">
  <div class="pt-between">
    <div class="pt-col-2">
      <p class="ml-overline ml-muted">Settings</p>
      <h1 class="pt-title">Feedback inbox</h1>
      <p class="pt-body pt-measure">Bug reports, suggestions and questions sent through the feedback form. Mark them answered when done.</p>
    </div>
    <div class="pt-row-2"><a class="ml-btn ml-btn-secondary" href="../admin/categories.html">Categories</a><a class="ml-btn ml-btn-secondary" href="../admin/announcements.html">Announcements</a></div>
  </div>
  <div class="ml-chips" id="chips"></div>
  <div id="table"></div>
  <p class="pt-caption ml-muted"><span class="pt-todo" data-todo="FR-081 · The SRS defines the feedback form, not the admin inbox. The API contract has GET /api/admin/feedbacks. Where it sits in the admin menu and whether admins reply from here needs a decision.">Admin inbox placement and reply flow are not specified</span></p>
</main>
<script>
  document.getElementById('chips').innerHTML = PT.chip('Open', { selected: true, radio: 'f', count: 2 }) + PT.chip('Answered', { radio: 'f', count: 1 }) + PT.chip('Bug', { radio: 't', count: 1 }) + PT.chip('Suggestion', { radio: 't', count: 1 }) + PT.chip('Question', { radio: 't', count: 1 });
  var T = { bug: 'Bug report', suggestion: 'Suggestion', query: 'Question' };
  document.getElementById('table').innerHTML = PT.table(null, [
    { key: 'type', label: 'Type', render: function (f) { return T[f.type]; } },
    { key: 'text', label: 'Message', render: function (f) { return '<a href="#" class="pt-small" data-open-fb="' + f.id + '">' + PT.esc(f.text) + '</a>'; } },
    { key: 'from', label: 'From', render: function (f) { return f.from + '<span class="sub">' + f.date + '</span>'; } },
    { key: 's', label: 'Status', render: function (f) { return f.status === 'open' ? '<span class="ml-status ml-status-placed">' + PT.icons.placed() + '<span class="ml-status-text">Open</span></span>' : '<span class="ml-status ml-status-completed">' + PT.icons.completed() + '<span class="ml-status-text">Answered</span></span>'; } },
    { key: 'a', label: '', align: 'actions', render: function (f) { return '<button type="button" class="ml-btn ml-btn-secondary ml-btn-sm" data-open-fb="' + f.id + '">' + (f.status === 'open' ? 'Read and answer' : 'Read') + '</button>'; } },
  ], PT.feedback.map(function (f) { return Object.assign({ _new: f.status === 'open' && f.type === 'bug' }, f); }));
  document.getElementById('table').insertAdjacentHTML('afterend',
    '<p class="pt-caption ml-muted"><span class="pt-todo" data-todo="FR-081 · The SRS asks for a feedback form with bug, suggestion and query, and stops there. Nothing says an admin answers, by what channel, within what time, or whether the person who wrote it ever sees a reply. The inbox and this answer box are a proposal: they need a new FR, a reply channel that actually exists (email is FR-043, a NICE), and a feedback table with a status and a response. The same gap is flagged on public/feedback.html from the customer side.">Answering feedback is a proposal, not an SRS feature</span></p>');
  PT.states('#table', {
    label: 'this inbox',
    empty: ['No feedback yet', 'Bug reports, suggestions and questions from the feedback form arrive here.'],
    error: ['Couldn\'t load the feedback inbox', 'Check your connection and try again.'],
  });
  /* A row used to be a dead end: the message was clipped and nothing opened it. There is no reply
     screen because FR-081 only asks for the form with its three categories; what happens after a
     message is sent is still an open question on public/feedback.html, so this stays a dialog. */
  document.body.addEventListener('click', function (e) {
    var t = e.target.closest('[data-open-fb]');
    if (!t) return;
    e.preventDefault();
    var f = PT.feedback.find(function (x) { return String(x.id) === t.getAttribute('data-open-fb'); });
    if (!f) return;
    PT.dialog({
      title: T[f.type] + ' from ' + PT.esc(f.from),
      body: '<p class="pt-small ml-muted">Sent ' + f.date + ' · ' + (f.status === 'open' ? 'not answered yet' : 'already answered') + '</p>' +
        '<p class="ml-card pt-panel-4 pt-body">' + PT.esc(f.text) + '</p>' +
        '<div class="ml-field" style="min-width:0"><label class="ml-field-label" for="fbreply">Your answer</label><textarea id="fbreply" class="ml-input" rows="4" placeholder="Thank you for telling us…"></textarea><span class="ml-field-hint">Where this answer goes is not decided — see the open question on this screen.</span></div>',
      keep: 'Close', confirm: f.status === 'open' ? 'Send and mark answered' : 'Send again',
      onConfirm: function (dlg) {
        var msg = dlg.querySelector('#fbreply').value.trim();
        PT.toast(msg ? 'Answer saved and the message marked answered.' : 'Marked answered without a reply.');
      },
    });
  });
  PT.boot({ role: 'admin', active: 'settings', announce: false });
</script>
<div id="pt-foot"></div>
</body>
</html>

# CI for the two environment branches:
#   dev  — integration: every feature/* → dev PR must have green backend + frontend
#   main — production: a dev → main PR also builds the production image
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · format + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The contextLoads test needs a real DB + Redis; settings match .env.example / application-dev.yaml
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: intervue_db
          MYSQL_USER: intervue
          MYSQL_PASSWORD: intervue_pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: dev
      # application-dev.yaml is git-ignored, so the runner has no dev profile file:
      # Spring falls back to the placeholder in application.yaml (password `changename`) and
      # Flyway fails with 1045 Access denied. Variables in the `services` block only exist inside
      # the mysql container and do not reach the steps — so pass them again in the job env.
      MYSQL_DATABASE: intervue_db
      MYSQL_USER: intervue
      MYSQL_PASSWORD: intervue_pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Spotless check
        run: ./mvnw -B -q spotless:check
      - name: Test
        run: ./mvnw -B verify

  frontend:
    name: Frontend · lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier check
        run: npx prettier --check src
      - name: ESLint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker-prod:
    name: Docker · build image production
    # Only when touching main (a dev → main release PR, or a push to main)
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (target prod)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/backend.Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend (target prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/frontend.Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

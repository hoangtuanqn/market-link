# CI cho 2 nhánh môi trường:
#   dev  — tích hợp: mọi PR feature/* → dev phải xanh backend + frontend
#   main — production: PR dev → main build thêm image production
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · format + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Test contextLoads cần DB + Redis thật; thông số khớp .env.example / application-dev.yaml
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: intervue_db
          MYSQL_USER: intervue
          MYSQL_PASSWORD: intervue_pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: dev
      # application-dev.yaml bị git-ignore nên runner không có file của profile dev:
      # Spring rơi về placeholder trong application.yaml (password `changename`) và
      # Flyway đổ 1045 Access denied. Biến trong khối `services` chỉ tồn tại bên
      # trong container mysql, không lan ra step — nên phải truyền lại ở job env.
      MYSQL_DATABASE: intervue_db
      MYSQL_USER: intervue
      MYSQL_PASSWORD: intervue_pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Spotless check
        run: ./mvnw -B -q spotless:check
      - name: Test
        run: ./mvnw -B verify

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier check
        run: npx prettier --check src
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build

  docker-prod:
    name: Docker · build image production
    # Chỉ khi đụng tới main (PR release dev → main, hoặc push vào main)
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (target prod)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/backend.Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend (target prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/frontend.Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

# Guard: do not mix the dev and main environments (CONTRIBUTING.md §0)
#   Branch policy — PRs may only follow the right flow:  feature/* → dev → main,  hotfix/* → main → dev
#   Env guard     — dev / production config never mix, and no secrets are in git
# The repo owner sets both checks as "required" for main and dev (CONTRIBUTING.md §11).
name: Guard

on:
  pull_request:
    branches: [dev, main]
    # edited: runs again when someone changes the PR base (e.g. from dev to main)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, main]

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source → target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD → $BASE"
          case "$BASE" in
            main)
              # Production only accepts a release from dev or a hotfix
              if [[ "$HEAD" == "dev" || "$HEAD" == hotfix/* ]]; then
                echo "✓ Hợp lệ"; exit 0
              fi
              echo "::error::'$HEAD' không được merge vào main. main chỉ nhận PR từ 'dev' (release) hoặc 'hotfix/*'. Đổi base của PR sang dev (luật H-1)."
              exit 1
              ;;
            dev)
              # dev accepts working branches, or main when syncing back after a hotfix
              if [[ "$HEAD" == "main" || "$HEAD" =~ ^(feature|fix|docs|chore|refactor|test|hotfix)/ ]]; then
                echo "✓ Hợp lệ"; exit 0
              fi
              echo "::error::Tên nhánh '$HEAD' không đúng quy ước. Dùng feature/*, fix/*, docs/*, chore/*, refactor/*, test/*, hotfix/* (luật H-2)."
              exit 1
              ;;
          esac

  env-guard:
    name: Env guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dev / production configuration is not mixed
        run: bash scripts/check-env-separation.sh

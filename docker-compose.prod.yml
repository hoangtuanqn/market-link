# ---------------------------------------------------------------------
# PRODUCTION override (main branch): prebuilt images, no source mount,
# DB/Redis expose no ports, every secret comes from .env.production.
#   make prod
#   = docker compose -p market-link-prod --env-file .env.production \
#       -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# Separate project (-p market-link-prod) → containers, network, volumes completely separate from dev.
# ---------------------------------------------------------------------
services:
  mysql:
    container_name: marketlink-prod-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env.production}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Thiếu MYSQL_DATABASE trong .env.production}
      MYSQL_USER: ${MYSQL_USER:?Thiếu MYSQL_USER trong .env.production}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD trong .env.production}
    ports: !reset []

  redis:
    container_name: marketlink-prod-redis
    ports: !reset []

  rabbitmq:
    container_name: marketlink-prod-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Thiếu RABBITMQ_USER trong .env.production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Thiếu RABBITMQ_PASSWORD trong .env.production}
    ports: !reset []

  backend:
    container_name: marketlink-prod-backend
    build:
      target: prod
    image: market-link-backend:prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # docker-compose.yml turns this on for dev; prod keeps Flyway's strict version order
      SPRING_FLYWAY_OUT_OF_ORDER: "false"
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env.production}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Thiếu MFA_ENCRYPTION_KEY trong .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Thiếu CORS_ALLOWED_ORIGINS trong .env.production}
      # FR-003: false only when the site is served over plain HTTP (browsers drop Secure cookies there)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USER: ${RABBITMQ_USER:?Thiếu RABBITMQ_USER trong .env.production}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Thiếu RABBITMQ_PASSWORD trong .env.production}
      # FR-042 N3: Web Push — optional, off when empty
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # FR-090/091: Claude assistant — optional, keyword engine only when empty
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHATBOT_AI_MODEL: ${CHATBOT_AI_MODEL:-claude-haiku-4-5}
      CHATBOT_AI_MESSAGES_PER_HOUR: ${CHATBOT_AI_MESSAGES_PER_HOUR:-30}
      CHATBOT_AI_ADMIN_MESSAGES_PER_HOUR: ${CHATBOT_AI_ADMIN_MESSAGES_PER_HOUR:-60}
      CHATBOT_AI_PLATFORM_MESSAGES_PER_DAY: ${CHATBOT_AI_PLATFORM_MESSAGES_PER_DAY:-1500}
      # FR-009 / FR-007: SMTP for the sign-up code and password emails; empty user → mails go to the log
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Links and addresses inside those emails; the application.yaml defaults point at localhost
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:?Thiếu PASSWORD_RESET_URL trong .env.production}
      SIGN_IN_URL: ${SIGN_IN_URL:?Thiếu SIGN_IN_URL trong .env.production}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Thiếu SUPPORT_EMAIL trong .env.production}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      # Do not publish the API docs in production. If they need to be on (e.g. for the examiner) set SWAGGER_ENABLED=true
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CHAT_UPLOAD_DIR: ${CHAT_UPLOAD_DIR:?Thiếu CHAT_UPLOAD_DIR trong .env.production}
      CHAT_MAX_UPLOAD_BYTES: ${CHAT_MAX_UPLOAD_BYTES:?Thiếu CHAT_MAX_UPLOAD_BYTES trong .env.production}
      CHAT_MESSAGES_PER_MINUTE: ${CHAT_MESSAGES_PER_MINUTE:?Thiếu CHAT_MESSAGES_PER_MINUTE trong .env.production}
      CHAT_IMAGES_PER_HOUR: ${CHAT_IMAGES_PER_HOUR:?Thiếu CHAT_IMAGES_PER_HOUR trong .env.production}
      CHAT_CONVERSATIONS_PER_HOUR: ${CHAT_CONVERSATIONS_PER_HOUR:?Thiếu CHAT_CONVERSATIONS_PER_HOUR trong .env.production}
      CHAT_TYPING_FRAMES_PER_MINUTE: ${CHAT_TYPING_FRAMES_PER_MINUTE:?Thiếu CHAT_TYPING_FRAMES_PER_MINUTE trong .env.production}
    ports: !override
      - "${BACKEND_PORT:-8080}:8080"
    # /ping is public (SecurityConfig), so a hung JVM or a stuck Tomcat shows up as unhealthy.
    # start_period covers Flyway + Spring startup (~15s on the Mac mini, longer after a cold boot).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # No source mount; only keep user-uploaded images (project prod → its own volume separate from dev)
    volumes: !override
      - uploads-data:/app/uploads
      - chat-uploads:/var/lib/marketlink/chat # FR-115: chat images

  frontend:
    container_name: marketlink-prod-frontend
    build:
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:?Thiếu VITE_API_URL trong .env.production}
        # Not required: left empty the map runs on OpenStreetMap tiles
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
    image: market-link-frontend:prod
    environment: !reset [] # nginx serves the static files, the API URL is embedded at build time
    ports: !override
      - "${FRONTEND_PORT:-80}:3000"
    volumes: !reset []

# Dev bind-mounts ./backend/uploads instead, so only prod declares this volume. Both upload settings resolve to
# /app/uploads: app.storage.dir (STORAGE_DIR, inherited from docker-compose.yml) for avatars and product, market and
# quality-report photos, and app.uploads.dir ("uploads" under WORKDIR /app) for farmer-application files.
volumes:
  uploads-data:

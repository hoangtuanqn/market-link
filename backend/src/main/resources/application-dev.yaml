# ---------------------------------------------------------------------
# Profile "dev" — môi trường phát triển (nhánh dev, máy của từng thành viên)
# Giá trị mặc định khớp .env.example: clone về là chạy được, không cần tạo file bí mật.
# KHÔNG chứa bí mật thật. Muốn ghi đè riêng máy mình: thêm application-local.yml
# (git-ignore) và chạy với profiles=dev,local
# ---------------------------------------------------------------------
spring:
  datasource:
    username: ${MYSQL_USER:intervue}
    password: ${MYSQL_PASSWORD:intervue_pass}
  jpa:
    open-in-view: false

logging:
  level:
    com.techx.intervue: DEBUG
    org.flywaydb: INFO

jwt:
  # Secret chỉ dùng cho dev — production bắt buộc truyền JWT_SECRET (xem application-prod.yaml)
  secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1tYXJrZXRsaW5rLWRvLW5vdC11c2UtaW4tcHJvZA==}

# Đăng nhập Google / Facebook — thay giá trị mẫu bằng key thật của bạn.
# ⚠ File này được commit: đừng để secret thật ở đây khi push. Cách an toàn: đặt biến môi trường
# (GOOGLE_CLIENT_SECRET, ...) hoặc ghi đè trong application-local.yml (git-ignore, chạy profiles=dev,local).
# redirect-uri phải khớp 100% với URI đã khai báo trên Google Cloud Console / Facebook App và với URI
# frontend dùng khi mở trang đăng nhập. Google popup (GIS code client) thì dùng "postmessage".
app:
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
      client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}
    facebook:
      app-id: ${FACEBOOK_APP_ID:your-facebook-app-id}
      app-secret: ${FACEBOOK_APP_SECRET:your-facebook-app-secret}
      redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:3000/auth/facebook/callback}

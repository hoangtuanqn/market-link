# Notification text (spec §3) — UTF-8, {name} is replaced by a parameter. Keep every key in all 10 files.
notification.farmer_application.title=Neuer Farmer-Antrag
notification.farmer_application.message={stall} möchte auf MarketLink verkaufen.
notification.feedback.title=Neues Feedback erhalten
notification.feedback.message={sender} hat eine neue Rückmeldung gesendet.
notification.farmer_approved.title=Ihr Stand ist freigegeben
notification.farmer_approved.message={stall} ist freigegeben. Melden Sie sich erneut an, um Ihren Standbereich zu öffnen.
notification.farmer_rejected.title=Ihr Standantrag wurde nicht freigegeben
notification.farmer_rejected.message=Grund: {reason}
notification.farmer_suspended.title=Ihr Stand ist gesperrt
notification.farmer_suspended.message={stall} ist für Kunden vorerst ausgeblendet. Bereits aufgegebene Bestellungen laufen weiter.
notification.farmer_reinstated.title=Ihr Stand ist wieder geöffnet
notification.farmer_reinstated.message={stall} ist für Kunden wieder sichtbar.
notification.order_placed.title=Neue Bestellung an Ihrem Stand
notification.order_placed.message={customer} hat Bestellung {order} aufgegeben.
notification.order_accepted.title=Ihre Bestellung wurde angenommen
notification.order_accepted.message={stall} hat Ihre Bestellung {order} angenommen. Sie wird bald fertig sein.
notification.order_declined.title=Ihre Bestellung wurde abgelehnt
notification.order_declined.message={stall} konnte Bestellung {order} nicht annehmen. Grund: {reason}
notification.order_ready.title=Ihre Bestellung ist abholbereit
notification.order_ready.message={stall} hat Bestellung {order} für die Abholung bereit.
notification.order_cancelled.title=Eine Bestellung wurde storniert
notification.order_cancelled.message=Der Kunde hat Bestellung {order} storniert.
notification.order_cancelled_account_deactivated.title=Eine Bestellung wurde storniert
notification.order_cancelled_account_deactivated.message=Bestellung {order} wurde storniert — das Konto des Kunden wurde gesperrt.
notification.restock.title={product} ist wieder vorrätig
notification.restock.message={stall} hat {product} wieder. Bestellen Sie, bevor es ausverkauft ist.
notification.quality_reported.title=Ein Kunde hat verdorbene Ware gemeldet
notification.quality_reported.message={product} aus Bestellung {order}. Sie können antworten, bis ein Administrator entscheidet.
notification.quality_escalated.title=Verdorbene Ware trotz verlängerter Haltbarkeit
notification.quality_escalated.message={stall} · {product} (+{days} Tage), Bestellung {order}.
notification.quality_decided.title=Eine Verderb-Meldung wurde entschieden
notification.quality_decided.message=Ein Administrator hat über die Meldung zu {product} in Bestellung {order} entschieden. Öffnen Sie sie, um die Entscheidung zu sehen.
notification.shelf_life_violation.title=Ein Haltbarkeits-Verstoß an Ihrem Stand
notification.shelf_life_violation.message=Ein Administrator hat die Verderb-Meldung zu {product} bestätigt, die Haltbarkeit wurde auf den Vorschlag zurückgesetzt. Verstöße in den letzten 90 Tagen: {count} (3 sperren längere Haltbarkeiten).
notification.shelf_life_locked.title=Längere Haltbarkeiten sind vorerst gesperrt
notification.shelf_life_locked.message=Ihr Stand hat 3 Haltbarkeits-Verstöße in 90 Tagen erreicht. Bis {until} können Sie nur die vorgeschlagene Haltbarkeit verwenden.
notification.message.message={sender} hat ein Foto gesendet
notification.message.video={sender} hat ein Video gesendet
notification.test.title=Benachrichtigungen funktionieren
notification.test.message=So sehen Benachrichtigungen von MarketLink aus.

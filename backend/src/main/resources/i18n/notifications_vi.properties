# Notification text (spec §3) — UTF-8, {name} is replaced by a parameter. Keep every key in all 10 files.
notification.farmer_application.title=Có đơn đăng ký nhà vườn mới
notification.farmer_application.message={stall} vừa đăng ký bán hàng trên MarketLink.
notification.feedback.title=Có góp ý mới
notification.feedback.message={sender} vừa gửi một góp ý mới.
notification.farmer_approved.title=Sạp của bạn đã được duyệt
notification.farmer_approved.message={stall} đã được duyệt. Đăng nhập lại để mở trang quản lý sạp.
notification.farmer_rejected.title=Đơn đăng ký sạp chưa được duyệt
notification.farmer_rejected.message=Lý do: {reason}
notification.farmer_suspended.title=Sạp của bạn đang bị tạm khoá
notification.farmer_suspended.message={stall} tạm thời bị ẩn với khách. Các đơn đã đặt vẫn được xử lý.
notification.farmer_reinstated.title=Sạp của bạn đã mở lại
notification.farmer_reinstated.message={stall} đã hiện lại với khách.
notification.order_placed.title=Có đơn hàng mới tại sạp của bạn
notification.order_placed.message={customer} vừa đặt đơn {order}.
notification.order_accepted.title=Đơn hàng của bạn đã được nhận
notification.order_accepted.message={stall} đã nhận đơn {order} của bạn. Đơn sẽ sớm sẵn sàng.
notification.order_declined.title=Đơn hàng của bạn đã bị từ chối
notification.order_declined.message={stall} không thể nhận đơn {order}. Lý do: {reason}
notification.order_ready.title=Đơn hàng của bạn đã sẵn sàng để nhận
notification.order_ready.message={stall} đã chuẩn bị xong đơn {order}, sẵn sàng để bạn đến nhận.
notification.order_cancelled.title=Một đơn hàng đã bị huỷ
notification.order_cancelled.message=Khách hàng đã huỷ đơn {order}.
notification.order_changed.title=Một đơn hàng đã được sửa
notification.order_changed.message=Khách hàng đã sửa đơn {order}. Hãy xem số lượng mới rồi duyệt lại.
notification.order_cancelled_account_deactivated.title=Một đơn hàng đã bị huỷ
notification.order_cancelled_account_deactivated.message=Đơn {order} đã bị huỷ — tài khoản của khách hàng đã bị vô hiệu hoá.
notification.restock.title={product} đã có hàng trở lại
notification.restock.message={stall} lại có {product}. Đặt ngay trước khi hết hàng.
notification.quality_reported.title=Khách báo hàng bị hư
notification.quality_reported.message={product} trong đơn {order}. Bạn có thể phản hồi cho tới khi admin quyết định.
notification.quality_escalated.title=Báo hư hàng kéo dài hạn
notification.quality_escalated.message={stall} · {product} (+{days} ngày), đơn {order}.
notification.quality_decided.title=Báo cáo hàng hư đã được xử lý
notification.quality_decided.message=Admin đã xử lý báo cáo về {product} trong đơn {order}. Mở ra để xem quyết định.
notification.shelf_life_violation.title=Sạp bị ghi một lỗi hạn dùng
notification.shelf_life_violation.message=Admin đã xác nhận báo hư của {product}, hạn dùng của món này đã về mốc gợi ý. Lỗi hạn dùng trong 90 ngày: {count} (đủ 3 lỗi thì bị khoá kéo dài).
notification.shelf_life_locked.title=Sạp tạm bị khoá kéo dài hạn dùng
notification.shelf_life_locked.message=Sạp có 3 lỗi hạn dùng trong 90 ngày. Tới {until}, sạp chỉ dùng được hạn gợi ý.
notification.message.message={sender} đã gửi một ảnh
notification.message.video={sender} đã gửi một video
notification.test.title=Thông báo đang hoạt động
notification.test.message=Thông báo của MarketLink sẽ hiện ra như thế này.

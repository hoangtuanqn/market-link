# Notification text (spec §3) — UTF-8, {name} is replaced by a parameter. Keep all 35 keys in all 10 files.
notification.farmer_application.title=新しい Farmer の申請
notification.farmer_application.message={stall} が MarketLink での販売を申請しました。
notification.farmer_approved.title=店舗が承認されました
notification.farmer_approved.message={stall} が承認されました。店舗パネルを開くには再度ログインしてください。
notification.farmer_rejected.title=店舗の申請は承認されませんでした
notification.farmer_rejected.message=理由: {reason}
notification.farmer_suspended.title=店舗が一時停止されました
notification.farmer_suspended.message={stall} は現在お客様に表示されていません。すでに受けた注文はそのまま進みます。
notification.farmer_reinstated.title=店舗が再開されました
notification.farmer_reinstated.message={stall} は再びお客様に表示されています。
notification.order_placed.title=店舗に新しい注文が入りました
notification.order_placed.message={customer} さんが注文 {order} を確定しました。
notification.order_accepted.title=注文が受け付けられました
notification.order_accepted.message={stall} が注文 {order} を受け付けました。まもなく準備が整います。
notification.order_declined.title=注文が受け付けられませんでした
notification.order_declined.message={stall} は注文 {order} を受け付けられませんでした。理由: {reason}
notification.order_ready.title=注文の受け取り準備ができました
notification.order_ready.message={stall} で注文 {order} の受け取り準備ができました。
notification.order_cancelled.title=注文がキャンセルされました
notification.order_cancelled.message=お客様が注文 {order} をキャンセルしました。
notification.restock.title={product} が再入荷しました
notification.restock.message={stall} に {product} が再入荷しました。売り切れる前にご注文ください。
notification.quality_reported.title=お客様から商品の傷みが報告されました
notification.quality_reported.message=注文 {order} の {product} です。管理者が判断するまで返信できます。
notification.quality_escalated.title=延長した賞味期限内での傷み報告
notification.quality_escalated.message={stall} · {product}（+{days} 日）、注文 {order}。
notification.quality_decided.title=傷み報告の対応が完了しました
notification.quality_decided.message=注文 {order} の {product} についての報告に管理者が対応しました。開いて対応内容を確認してください。
notification.shelf_life_violation.title=店舗に賞味期限の違反が記録されました
notification.shelf_life_violation.message=管理者が {product} の傷み報告を確認し、賞味期限は提案値に戻りました。過去90日間の違反回数：{count}（3回で延長ができなくなります）。
notification.shelf_life_locked.title=賞味期限の延長は現在ロックされています
notification.shelf_life_locked.message=店舗が90日間で3回の賞味期限違反に達しました。{until} まで、提案された賞味期限のみ使用できます。
notification.message.message={sender} さんが写真を送信しました
notification.test.title=通知は正常に動作しています
notification.test.message=MarketLink の通知はこのように表示されます。

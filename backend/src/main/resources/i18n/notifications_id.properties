notification.shelf_life_violation.message=Admin telah mengonfirmasi laporan kerusakan pada {product}, dan masa simpannya kembali ke saran awal. Pelanggaran dalam 90 hari terakhir: {count} (3 kali mengunci masa simpan yang lebih panjang).
notification.shelf_life_locked.title=Masa simpan yang lebih panjang terkunci untuk saat ini
notification.shelf_life_locked.message=Lapak Anda mencapai 3 pelanggaran masa simpan dalam 90 hari. Sampai {until} Anda hanya dapat menggunakan masa simpan yang disarankan.

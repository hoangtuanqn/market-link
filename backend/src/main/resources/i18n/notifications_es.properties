# Notification text (spec §3) — UTF-8, {name} is replaced by a parameter. Keep every key in all 10 files.
notification.farmer_application.title=Nueva solicitud de Farmer
notification.farmer_application.message={stall} ha solicitado vender en MarketLink.
notification.feedback.title=Nuevo comentario recibido
notification.feedback.message={sender} ha enviado un nuevo comentario.
notification.farmer_approved.title=Tu puesto ha sido aprobado
notification.farmer_approved.message={stall} ha sido aprobado. Vuelve a iniciar sesión para abrir el panel de tu puesto.
notification.farmer_rejected.title=Tu solicitud de puesto no fue aprobada
notification.farmer_rejected.message=Motivo: {reason}
notification.farmer_suspended.title=Tu puesto está suspendido
notification.farmer_suspended.message={stall} está oculto para los clientes por ahora. Los pedidos ya hechos siguen adelante.
notification.farmer_reinstated.title=Tu puesto vuelve a estar abierto
notification.farmer_reinstated.message={stall} vuelve a estar visible para los clientes.
notification.order_placed.title=Nuevo pedido en tu puesto
notification.order_placed.message={customer} hizo el pedido {order}.
notification.order_accepted.title=Tu pedido fue aceptado
notification.order_accepted.message={stall} aceptó tu pedido {order}. Estará listo pronto.
notification.order_declined.title=Tu pedido fue rechazado
notification.order_declined.message={stall} no pudo aceptar el pedido {order}. Motivo: {reason}
notification.order_ready.title=Tu pedido está listo para recoger
notification.order_ready.message={stall} tiene listo el pedido {order} para recoger.
notification.order_cancelled.title=Un pedido fue cancelado
notification.order_cancelled.message=El cliente canceló el pedido {order}.
notification.order_changed.title=Un pedido fue modificado
notification.order_changed.message=El cliente modificó el pedido {order}. Revisa las nuevas cantidades y acéptalo de nuevo.
notification.order_cancelled_account_deactivated.title=Un pedido fue cancelado
notification.order_cancelled_account_deactivated.message=El pedido {order} fue cancelado: la cuenta del cliente fue desactivada.
notification.restock.title={product} vuelve a estar disponible
notification.restock.message={stall} vuelve a tener {product}. Haz tu pedido antes de que se agote.
notification.quality_reported.title=Un cliente reportó un producto dañado
notification.quality_reported.message={product} del pedido {order}. Puedes responder hasta que un administrador decida.
notification.quality_escalated.title=Producto dañado con una vida útil extendida
notification.quality_escalated.message={stall} · {product} (+{days} días), pedido {order}.
notification.quality_decided.title=Se resolvió un reporte de producto dañado
notification.quality_decided.message=Un administrador resolvió el reporte sobre {product} en el pedido {order}. Ábrelo para ver la decisión.
notification.shelf_life_violation.title=Una infracción de vida útil en tu puesto
notification.shelf_life_violation.message=Un administrador confirmó el reporte de producto dañado sobre {product}, y su vida útil volvió al valor sugerido. Infracciones en los últimos 90 días: {count} (3 bloquean vidas útiles más largas).
notification.shelf_life_locked.title=Las vidas útiles más largas están bloqueadas por ahora
notification.shelf_life_locked.message=Tu puesto llegó a 3 infracciones de vida útil en 90 días. Hasta el {until} solo puedes usar la vida útil sugerida.
notification.message.message={sender} envió una foto
notification.message.video={sender} envió un video
notification.test.title=Las notificaciones funcionan
notification.test.message=Así se verán las notificaciones de MarketLink.

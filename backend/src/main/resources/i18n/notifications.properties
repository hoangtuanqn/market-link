# Notification text (spec §3) — UTF-8, {name} is replaced by a parameter. Keep every key in all 10 files.
notification.farmer_application.title=New Farmer application
notification.farmer_application.message={stall} applied to sell on MarketLink.
notification.feedback.title=New feedback received
notification.feedback.message={sender} sent a new feedback message.
notification.farmer_approved.title=Your stall is approved
notification.farmer_approved.message={stall} is approved. Sign in again to open your stall panel.
notification.farmer_rejected.title=Your stall application was not approved
notification.farmer_rejected.message=Reason: {reason}
notification.farmer_suspended.title=Your stall is suspended
notification.farmer_suspended.message={stall} is hidden from customers for now. Orders already placed still go ahead.
notification.farmer_reinstated.title=Your stall is open again
notification.farmer_reinstated.message={stall} is visible to customers again.
notification.order_placed.title=New order at your stall
notification.order_placed.message={customer} placed order {order}.
notification.order_accepted.title=Your order was accepted
notification.order_accepted.message={stall} accepted your order {order}. It will be ready soon.
notification.order_declined.title=Your order was declined
notification.order_declined.message={stall} could not take order {order}. Reason: {reason}
notification.order_ready.title=Your order is ready for pickup
notification.order_ready.message={stall} has your order {order} ready for pickup.
notification.order_cancelled.title=An order was cancelled
notification.order_cancelled.message=The customer cancelled order {order}.
notification.order_cancelled_account_deactivated.title=An order was cancelled
notification.order_cancelled_account_deactivated.message=Order {order} was cancelled — the customer's account was deactivated.
notification.restock.title={product} is back in stock
notification.restock.message={stall} has {product} again. Order before it runs out.
notification.quality_reported.title=A customer reported spoiled produce
notification.quality_reported.message={product} from order {order}. You can reply until an admin decides.
notification.quality_escalated.title=Spoiled produce on an extended shelf life
notification.quality_escalated.message={stall} · {product} (+{days} days), order {order}.
notification.quality_decided.title=A spoilage report was decided
notification.quality_decided.message=An admin decided on the report about {product} in order {order}. Open it to see the decision.
notification.shelf_life_violation.title=A shelf-life strike on your stall
notification.shelf_life_violation.message=An admin confirmed the spoilage report on {product}, and its shelf life is back to the suggestion. Strikes in the last 90 days: {count} (3 lock longer shelf lives).
notification.shelf_life_locked.title=Longer shelf lives are locked for now
notification.shelf_life_locked.message=Your stall reached 3 shelf-life strikes in 90 days. Until {until} you can only use the suggested shelf life.
notification.message.message={sender} sent a photo
notification.message.video={sender} sent a video
notification.test.title=Notifications are working
notification.test.message=This is how MarketLink notifications will look.

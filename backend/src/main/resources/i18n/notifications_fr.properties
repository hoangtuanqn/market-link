# Notification text (spec §3) — UTF-8, {name} is replaced by a parameter. Keep every key in all 10 files.
notification.farmer_application.title=Nouvelle demande Farmer
notification.farmer_application.message={stall} demande à vendre sur MarketLink.
notification.feedback.title=Nouveau retour reçu
notification.feedback.message={sender} a envoyé un nouveau message de retour.
notification.farmer_approved.title=Votre stand est approuvé
notification.farmer_approved.message={stall} est approuvé. Reconnectez-vous pour ouvrir votre espace stand.
notification.farmer_rejected.title=Votre demande de stand n’a pas été approuvée
notification.farmer_rejected.message=Motif : {reason}
notification.farmer_suspended.title=Votre stand est suspendu
notification.farmer_suspended.message={stall} est masqué aux clients pour le moment. Les commandes déjà passées suivent leur cours.
notification.farmer_reinstated.title=Votre stand est de nouveau ouvert
notification.farmer_reinstated.message={stall} est de nouveau visible par les clients.
notification.order_placed.title=Nouvelle commande à votre stand
notification.order_placed.message={customer} a passé la commande {order}.
notification.order_accepted.title=Votre commande a été acceptée
notification.order_accepted.message={stall} a accepté votre commande {order}. Elle sera bientôt prête.
notification.order_declined.title=Votre commande a été refusée
notification.order_declined.message={stall} n’a pas pu accepter la commande {order}. Motif : {reason}
notification.order_ready.title=Votre commande est prête à être récupérée
notification.order_ready.message={stall} a préparé la commande {order}, prête à récupérer.
notification.order_cancelled.title=Une commande a été annulée
notification.order_cancelled.message=Le client a annulé la commande {order}.
notification.order_changed.title=Une commande a été modifiée
notification.order_changed.message=Le client a modifié la commande {order}. Vérifiez les nouvelles quantités et acceptez-la à nouveau.
notification.order_cancelled_account_deactivated.title=Une commande a été annulée
notification.order_cancelled_account_deactivated.message=La commande {order} a été annulée — le compte du client a été désactivé.
notification.restock.title={product} est de nouveau disponible
notification.restock.message={stall} a de nouveau {product}. Commandez avant qu’il ne soit épuisé.
notification.quality_reported.title=Un client a signalé un produit abîmé
notification.quality_reported.message={product} de la commande {order}. Vous pouvez répondre jusqu’à la décision d’un administrateur.
notification.quality_escalated.title=Produit abîmé malgré une durée de conservation prolongée
notification.quality_escalated.message={stall} · {product} (+{days} jours), commande {order}.
notification.quality_decided.title=Un signalement de produit abîmé a été traité
notification.quality_decided.message=Un administrateur a statué sur le signalement concernant {product} dans la commande {order}. Ouvrez-le pour voir la décision.
notification.shelf_life_violation.title=Un manquement à la durée de conservation sur votre stand
notification.shelf_life_violation.message=Un administrateur a confirmé le signalement sur {product}, et sa durée de conservation est revenue à la valeur suggérée. Manquements des 90 derniers jours : {count} (3 bloquent les durées prolongées).
notification.shelf_life_locked.title=Les durées de conservation prolongées sont bloquées pour le moment
notification.shelf_life_locked.message=Votre stand a atteint 3 manquements à la durée de conservation en 90 jours. Jusqu’au {until}, vous ne pouvez utiliser que la durée suggérée.
notification.message.message={sender} a envoyé une photo
notification.message.video={sender} a envoyé une vidéo
notification.test.title=Les notifications fonctionnent
notification.test.message=Voici à quoi ressembleront les notifications MarketLink.

# Notification text (spec §3) — UTF-8, {name} is replaced by a parameter. Keep every key in all 10 files.
notification.farmer_application.title=新的农户申请
notification.farmer_application.message={stall} 申请在 MarketLink 上销售。
notification.feedback.title=收到新的用户反馈
notification.feedback.message={sender} 提交了一条新的反馈信息。
notification.farmer_approved.title=你的摊位已通过审核
notification.farmer_approved.message={stall} 已通过审核。请重新登录以打开摊位面板。
notification.farmer_rejected.title=你的摊位申请未通过
notification.farmer_rejected.message=原因：{reason}
notification.farmer_suspended.title=你的摊位已被暂停
notification.farmer_suspended.message={stall} 暂时对顾客隐藏。已下的订单仍会继续处理。
notification.farmer_reinstated.title=你的摊位已重新开放
notification.farmer_reinstated.message={stall} 已重新对顾客可见。
notification.order_placed.title=你的摊位收到新订单
notification.order_placed.message={customer} 下单了订单 {order}。
notification.order_accepted.title=你的订单已被接受
notification.order_accepted.message={stall} 已接受你的订单 {order}，很快就会准备好。
notification.order_declined.title=你的订单被拒绝了
notification.order_declined.message={stall} 无法接受订单 {order}。原因：{reason}
notification.order_ready.title=你的订单可以取货了
notification.order_ready.message={stall} 已备好订单 {order}，可以前往取货。
notification.order_cancelled.title=有一笔订单被取消
notification.order_cancelled.message=顾客取消了订单 {order}。
notification.order_changed.title=有一笔订单被修改
notification.order_changed.message=顾客修改了订单 {order}。请查看新的数量后重新接单。
notification.order_cancelled_account_deactivated.title=有一笔订单被取消
notification.order_cancelled_account_deactivated.message=订单 {order} 已取消——该顾客的账号已被停用。
notification.restock.title={product} 已重新到货
notification.restock.message={stall} 又有 {product} 了，趁还没卖完赶快下单。
notification.quality_reported.title=顾客举报商品变质
notification.quality_reported.message=订单 {order} 中的 {product}。在管理员处理之前，你都可以回复。
notification.quality_escalated.title=延长保质期后仍变质
notification.quality_escalated.message={stall} · {product}（+{days} 天），订单 {order}。
notification.quality_decided.title=变质举报已处理
notification.quality_decided.message=管理员已处理订单 {order} 中 {product} 的举报，点开查看处理结果。
notification.shelf_life_violation.title=你的摊位收到一次保质期违规
notification.shelf_life_violation.message=管理员已确认 {product} 的变质举报，其保质期已恢复为建议值。最近 90 天内的违规次数：{count}（满 3 次将被限制延长保质期）。
notification.shelf_life_locked.title=延长保质期功能暂时被锁定
notification.shelf_life_locked.message=你的摊位在 90 天内已达到 3 次保质期违规。在 {until} 之前，只能使用建议的保质期。
notification.message.message={sender} 发送了一张照片
notification.message.video={sender} 发送了一段视频
notification.test.title=通知已开启
notification.test.message=MarketLink 的通知会像这样显示。

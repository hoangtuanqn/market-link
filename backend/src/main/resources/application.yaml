# ---------------------------------------------------------------------
# Cấu hình chung cho mọi môi trường.
# Key nhạy cảm (DB, JWT, mail) chỉ để placeholder ở đây và được ghi đè trong
# application-dev.yaml / application-prod.yaml — hai file này git-ignore,
# tạo từ application-dev.yaml.example / application-prod.yaml.example.
# ---------------------------------------------------------------------
spring:
  application:
    name: intervue

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/${MYSQL_DATABASE:intervue_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:intervue}
    password: ${MYSQL_PASSWORD:changename}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

  # Trần an toàn cho upload. Ảnh/video đơn xin thành Farmer (docs/prototype/customer/become-farmer.html) cần mức này —
  # FarmerUploadService; ảnh đại diện vẫn bị service chặn ở 2 MB với thông báo rõ.
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 60MB

  flyway:
    # Không bao giờ cho phép xoá schema
    clean-disabled: true

  # SMTP gửi mail (FR-007). Tài khoản/mật khẩu ghi đè trong application-<profile>.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    # Prod đặt APP_LOG_LEVEL=INFO (docker-compose.prod.yml)
    com.techx.intervue: ${APP_LOG_LEVEL:DEBUG}
    org.flywaydb: INFO

app:
  # Thành tích cá nhân (không có trong SRS, LEAD yêu cầu): ngưỡng lên hạng. Phải đạt đủ cả ba —
  # số đơn hoàn tất, tổng đã chi (₫, chỉ đơn hoàn tất), tỉ lệ hoàn tất (% trên hoàn tất + tự huỷ).
  tiers:
    silver:
      min-completed: 5
      min-spent: 500000
      min-completion-rate: 60
    gold:
      min-completed: 15
      min-spent: 2000000
      min-completion-rate: 75
    diamond:
      min-completed: 40
      min-spent: 6000000
      min-completion-rate: 85
  # File người dùng tải lên (ảnh đại diện). Docker: volume uploads-data ở /app/uploads
  storage:
    dir: ${STORAGE_DIR:./uploads}
  cors:
    # Origin của frontend React được phép gọi API, nhiều origin cách nhau dấu phẩy.
    # Mặc định là Vite dev server (frontend/vite.config.ts, cổng 3000). Prod bắt buộc truyền biến.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Đăng nhập Google. Client id/secret ghi đè trong application-dev.yaml (git-ignore) hoặc
  # truyền qua biến môi trường; để trống thì endpoint trả 503 "chưa cấu hình".
  # redirect-uri phải khớp 100% với URI khai báo trên Google Cloud Console và với URI
  # frontend dùng khi mở trang đăng nhập. Google popup (GIS code client) thì dùng "postmessage".
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}
  mail:
    from-name: MarketLink
  # Lưu ảnh/video đơn xin thành Farmer trên ổ đĩa cục bộ (FarmerUploadService) — chỉ phục vụ test/demo.
  uploads:
    dir: ${UPLOAD_DIR:uploads}
    base-url: /uploads
  # FR-007: link trong mail là <url>?token=<token>; url là trang đặt lại mật khẩu của frontend
  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    token-ttl-seconds: 900
    max-requests: 5
    # Chặn một IP gửi hàng loạt email khác nhau
    max-requests-per-ip: 20
    window-seconds: 3600
  # FR-008: xác thực hai bước TOTP cho admin. encryption-key = 32 byte Base64 mã hoá khoá TOTP trong DB
  # (openssl rand -base64 32). Giá trị mặc định chỉ dùng cho dev; prod bắt buộc MFA_ENCRYPTION_KEY.
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY:ZGV2LW9ubHktbWZhLWtleS1tYXJrZXRsaW5rLTAwMDA=}
    issuer: MarketLink
    pending-ttl-seconds: 300
    max-attempts: 5
    lock-seconds: 900
  # FR-111: chat realtime. Host rỗng = simple broker trong app (CI/test); docker compose và prod
  # đặt RABBITMQ_HOST để relay sang RabbitMQ (plugin rabbitmq_stomp, cổng 61613).
  chat:
    rabbitmq:
      host: ${RABBITMQ_HOST:}
      stomp-port: ${RABBITMQ_STOMP_PORT:61613}
      user: ${RABBITMQ_USER:guest}
      password: ${RABBITMQ_PASSWORD:guest}
    # Spec §8.4: chống rải tin. Mỗi user một bucket trên Redis (bucket4j).
    limits:
      messages-per-minute: ${CHAT_MESSAGES_PER_MINUTE:30}
      images-per-hour: ${CHAT_IMAGES_PER_HOUR:10}
      conversations-per-hour: ${CHAT_CONVERSATIONS_PER_HOUR:20}
    # Spec §8.2: ảnh chat nằm TÁCH khỏi app.storage.dir (thư mục đó phục vụ công khai qua /uploads).
    # Docker: volume chat-uploads ở /var/lib/marketlink/chat.
    upload-dir: ${CHAT_UPLOAD_DIR:./chat-uploads}
    max-upload-bytes: ${CHAT_MAX_UPLOAD_BYTES:5242880}

jwt:
  secret: ${JWT_SECRET:a1M8O206XTw5ITl6NzReN3BKTTNVaWY1L1dnfWFPQjIjaysvV2F3Tm5fZA==}
  expiration: 900000
  issuer: MarketLink
  refresh-token-ttl-days: 14

# Tài liệu API. Prod tắt bằng SWAGGER_ENABLED=false (docker-compose.prod.yml)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

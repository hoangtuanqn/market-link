# ---------------------------------------------------------------------
# Common configuration for every environment.
# Sensitive keys (DB, JWT, mail) are only placeholders here and are overridden in
# application-dev.yaml / application-prod.yaml — both are git-ignored,
# created from application-dev.yaml.example / application-prod.yaml.example.
# ---------------------------------------------------------------------
spring:
  application:
    name: intervue

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/${MYSQL_DATABASE:intervue_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:intervue}
    password: ${MYSQL_PASSWORD:changename}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

  # Safety ceiling for uploads. Farmer application images/videos (docs/prototype/customer/become-farmer.html) need this level —
  # FarmerUploadService; avatars are still capped by the service at 2 MB with a clear message.
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 60MB

  flyway:
    # Never allow the schema to be dropped
    clean-disabled: true

  # SMTP for sending mail (FR-007). Account/password overridden in application-<profile>.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    # Prod sets APP_LOG_LEVEL=INFO (docker-compose.prod.yml)
    com.techx.intervue: ${APP_LOG_LEVEL:DEBUG}
    org.flywaydb: INFO

app:
  # Personal achievements (not in the SRS, requested by the LEAD): tier thresholds. All three must be met —
  # completed orders, total spent (₫, completed orders only), completion rate (% of completed + self-cancelled).
  tiers:
    silver:
      min-completed: 5
      min-spent: 500000
      min-completion-rate: 60
    gold:
      min-completed: 15
      min-spent: 2000000
      min-completion-rate: 75
    diamond:
      min-completed: 40
      min-spent: 6000000
      min-completion-rate: 85
  # FR-042 N3: Web Push (RFC 8291/8292). Generate keys: make vapid-keys. Empty → push off, the app still runs.
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@marketlink.local}
  # User-uploaded files (avatars). Docker: the uploads-data volume at /app/uploads
  storage:
    dir: ${STORAGE_DIR:./uploads}
  cors:
    # Origins of the React frontend allowed to call the API, several origins separated by commas.
    # The default is the Vite dev server (frontend/vite.config.ts, port 3000). Prod requires the variable to be passed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Google sign-in. Client id/secret are overridden in application-dev.yaml (git-ignored) or
  # passed through environment variables; when empty the endpoint returns 503 "not configured".
  # redirect-uri must match 100% the URI declared in the Google Cloud Console and the URI
  # the frontend uses when opening the sign-in page. For the Google popup (GIS code client) use "postmessage".
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}
  mail:
    from-name: MarketLink
  # Stores Farmer application images/videos on the local disk (FarmerUploadService) — for test/demo only.
  uploads:
    dir: ${UPLOAD_DIR:uploads}
    base-url: /uploads
  # FR-007: the link in the email is <url>?token=<token>; url is the frontend's password reset page
  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    token-ttl-seconds: 900
    max-requests: 5
    # Block one IP from sending many different emails
    max-requests-per-ip: 20
    window-seconds: 3600
  # FR-008: TOTP two-step verification for admins. encryption-key = 32 bytes Base64 that encrypts the TOTP key in the DB
  # (openssl rand -base64 32). The default value is for dev only; prod requires MFA_ENCRYPTION_KEY.
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY:ZGV2LW9ubHktbWZhLWtleS1tYXJrZXRsaW5rLTAwMDA=}
    issuer: MarketLink
    pending-ttl-seconds: 300
    max-attempts: 5
    lock-seconds: 900
  # FR-102: admin account for dev/demo. AdminSeeder only runs in the dev and local profiles, and skips
  # if the email (or phone number) is already in the DB — changing the password then restarting is not overwritten.
  seed:
    admin:
      email: ${SEED_ADMIN_EMAIL:admin@marketlink.vn}
      password: ${SEED_ADMIN_PASSWORD:Admin@123}
      full-name: ${SEED_ADMIN_FULL_NAME:MarketLink Admin}
      phone: ${SEED_ADMIN_PHONE:0900000001}
  # FR-111: realtime chat. An empty host = the in-app simple broker (CI/test); docker compose and prod
  # set RABBITMQ_HOST to relay to RabbitMQ (rabbitmq_stomp plugin, port 61613).
  chat:
    rabbitmq:
      host: ${RABBITMQ_HOST:}
      stomp-port: ${RABBITMQ_STOMP_PORT:61613}
      user: ${RABBITMQ_USER:guest}
      password: ${RABBITMQ_PASSWORD:guest}
    # Spec §8.4: anti message-flooding. One bucket per user in Redis (bucket4j).
    limits:
      messages-per-minute: ${CHAT_MESSAGES_PER_MINUTE:30}
      images-per-hour: ${CHAT_IMAGES_PER_HOUR:10}
      conversations-per-hour: ${CHAT_CONVERSATIONS_PER_HOUR:20}
      typing-frames-per-minute: ${CHAT_TYPING_FRAMES_PER_MINUTE:120}
    # Spec §8.2: chat images live SEPARATE from app.storage.dir (that directory is served publicly through /uploads).
    # Docker: the chat-uploads volume at /var/lib/marketlink/chat.
    upload-dir: ${CHAT_UPLOAD_DIR:./chat-uploads}
    max-upload-bytes: ${CHAT_MAX_UPLOAD_BYTES:5242880}

jwt:
  secret: ${JWT_SECRET:a1M8O206XTw5ITl6NzReN3BKTTNVaWY1L1dnfWFPQjIjaysvV2F3Tm5fZA==}
  expiration: 900000
  issuer: MarketLink
  refresh-token-ttl-days: 14

# API docs. Prod turns them off with SWAGGER_ENABLED=false (docker-compose.prod.yml)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
